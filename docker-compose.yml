services:
  db:
    image: postgres:17
    container_name: pc_cinco_flow_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pc_cinco_flow

    volumes:
      - pc_cinco_flow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: pc_cinco_flow_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./backend/.env

    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend

    container_name: pc_cinco_flow_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3001:80"

volumes:
  pc_cinco_flow_postgres_data:
